<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
  <!-- Supabase SDK v3 (aceita chave sb_publishable) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observatório da Mulher · SMDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────── */
:root {
  --ink:    #0d0d14;
  --ink2:   #3a3a4e;
  --ink3:   #6e6e82;
  --rule:   #e8e6f0;
  --wash:   #f6f5fb;
  --page:   #ffffff;
  --accent: #5b21b6;
  --aclt:   #ede9fe;
  --acdk:   #3b0764;
  --ok:     #059669;
  --warn:   #d97706;
  --err:    #dc2626;
  --blue:   #2563eb;
  --r:      10px;
  --sh:     0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  --sh2:    0 8px 32px rgba(91,33,182,.12);
  --font:   'DM Sans', system-ui, sans-serif;
  --mono:   'DM Mono', monospace;
  --sidebar: 230px;
  --hdr:    56px;
}
.dark {
  --ink:    #f0eeff;
  --ink2:   #c4bfe8;
  --ink3:   #7c7898;
  --rule:   #2a2840;
  --wash:   #14121e;
  --page:   #1e1b2e;
  --accent: #a78bfa;
  --aclt:   #2d1f5e;
  --acdk:   #c4b5fd;
}

/* ── RESET ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--wash);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}

/* ── LAYOUT ──────────────────────────────────────── */
#shell{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--ink);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);
  position:relative;z-index:10;
}
#sidebar.collapsed{width:56px}
.sb-logo{
  height:var(--hdr);display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.sb-logo-icon{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo-icon svg{width:16px;height:16px;fill:#fff}
.sb-logo-text{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;opacity:1;transition:opacity .2s}
#sidebar.collapsed .sb-logo-text{opacity:0;pointer-events:none}
.sb-nav{flex:1;overflow-y:auto;padding:10px 0}
.sb-section{font-size:10px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.35);padding:12px 18px 4px;white-space:nowrap;overflow:hidden;transition:opacity .2s}
#sidebar.collapsed .sb-section{opacity:0}
.sb-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 16px;margin:1px 8px;border-radius:8px;
  color:rgba(255,255,255,.65);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;
  border:none;background:none;width:calc(100% - 16px);text-align:left;
}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-item.active{background:var(--accent);color:#fff}
.sb-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.sb-item.active svg{opacity:1}
.sb-label{overflow:hidden;opacity:1;transition:opacity .2s}
#sidebar.collapsed .sb-label{opacity:0;width:0}
.sb-badge{margin-left:auto;background:var(--err);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;flex-shrink:0}
#sidebar.collapsed .sb-badge{display:none}
.sb-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* TOPBAR */
#topbar{
  height:var(--hdr);background:var(--page);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0;
}
.tb-toggle{width:32px;height:32px;border-radius:7px;border:1px solid var(--rule);background:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-toggle svg{width:16px;height:16px;stroke:var(--ink3)}
.tb-title{font-size:15px;font-weight:700;flex:1}
.tb-search{position:relative;flex:0 0 240px}
.tb-search input{width:100%;background:var(--wash);border:1px solid var(--rule);border-radius:8px;padding:6px 12px 6px 34px;font-size:13px;color:var(--ink);outline:none;transition:border .15s}
.tb-search input:focus{border-color:var(--accent)}
.tb-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink3)}
.tb-actions{display:flex;gap:8px;align-items:center}
.tb-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--rule);background:none;color:var(--ink2)}
.tb-chip.admin{background:var(--aclt);border-color:var(--accent);color:var(--accent)}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.save-dot.unsaved{background:var(--warn);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:24px}

/* ── COMPONENTS ──────────────────────────────────── */
.card{background:var(--page);border:1px solid var(--rule);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--acdk);filter:brightness(1.1)}
.btn-ghost{background:none;border:1px solid var(--rule);color:var(--ink2)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:none;border:1px solid #fca5a5;color:var(--err)}.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-icon{padding:7px;border-radius:7px;border:1px solid var(--rule);background:none;display:flex;align-items:center;justify-content:center}
.btn-icon svg{width:15px;height:15px;stroke:var(--ink3)}
.btn-icon:hover{border-color:var(--accent);background:var(--aclt)}
.btn-icon:hover svg{stroke:var(--accent)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:5px;letter-spacing:.02em}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--rule);
  background:var(--wash);color:var(--ink);font-size:13px;outline:none;transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--page)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-ok{background:#d1fae5;color:#065f46}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-err{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:var(--aclt);color:var(--accent)}
.badge-gray{background:var(--wash);color:var(--ink3)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.stat{background:var(--page);border:1px solid var(--rule);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh)}
.stat-n{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat-l{font-size:12px;color:var(--ink3);margin-top:4px;font-weight:500}

.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;transition:width .5s}

.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border-bottom:2px solid var(--rule);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--wash)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(13,13,20,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .15s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--page);border-radius:14px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:slideup .2s cubic-bezier(.4,0,.2,1)}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--page);z-index:1}
.modal-title{font-size:17px;font-weight:800}
.modal-body{padding:20px 24px 24px}
.modal-footer{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end}

/* KANBAN */
.kb-board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.kb-col{background:var(--wash);border-radius:var(--r);border:1px solid var(--rule);overflow:hidden}
.kb-col-hdr{padding:12px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid}
.kb-col-body{padding:8px;min-height:200px}
.kb-card{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:12px;margin-bottom:6px;cursor:grab;transition:all .15s;box-shadow:var(--sh)}
.kb-card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.kb-card.dragging{opacity:.4;cursor:grabbing}
.kb-col.drag-over .kb-col-body{background:var(--aclt);border-radius:8px}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{min-height:110px;max-height:140px;overflow:hidden;background:var(--page);border:1px solid var(--rule);border-radius:6px;padding:6px;cursor:pointer;transition:all .15s;font-size:12px}
.cal-day:hover{border-color:var(--accent)}
.cal-day.today{border-color:var(--accent);background:var(--aclt)}
.cal-day.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cal-day-n{font-weight:700;color:var(--ink3);font-size:11px;margin-bottom:3px}
.cal-day.today .cal-day-n{color:var(--accent)}
.cal-pip{margin-top:3px;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3;display:block}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:80%}
.msg.me{flex-direction:row-reverse;margin-left:auto}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:700}
.msg-bubble{padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.msg.me .msg-bubble{background:var(--accent);color:#fff;border-radius:12px 12px 2px 12px}
.msg .msg-bubble{background:var(--wash);color:var(--ink);border-radius:12px 12px 12px 2px}
.msg-time{font-size:10px;color:var(--ink3);margin-top:4px}
.msg.me .msg-time{text-align:right}
.chat-input-wrap{border-top:1px solid var(--rule);padding:12px}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;resize:none;border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:13px;background:var(--wash);color:var(--ink);outline:none;max-height:120px;transition:border .15s;line-height:1.5}
.chat-input:focus{border-color:var(--accent);background:var(--page)}

/* PIPELINE */
.pipe-area{background:var(--wash);border-radius:var(--r);border:1px solid var(--rule);margin-bottom:8px;overflow:hidden}
.pipe-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;transition:background .15s}
.pipe-hdr:hover{background:rgba(91,33,182,.04)}
.pipe-body{padding:4px 12px 12px;display:none}
.pipe-body.open{display:block}
.pipe-ind{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:14px;margin-bottom:8px}
.pipe-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.pipe-step{border-radius:7px;padding:7px 8px;border:2px solid;text-align:center;font-size:11px;font-weight:700;transition:all .15s}
.pipe-step select{background:none;border:none;font-size:11px;font-weight:700;cursor:pointer;outline:none;width:100%}

/* TOAST */
#toasts{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:12px 18px;font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:toastin .25s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:10px;max-width:340px}
@keyframes toastin{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.out{animation:toastout .25s cubic-bezier(.4,0,.2,1) forwards}
@keyframes toastout{to{transform:translateX(100px);opacity:0}}

/* ── UTILS ───────────────────────────────────────── */
.text-sub{color:var(--ink3);font-size:12px}
.text-bold{font-weight:700}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.gap8{gap:8px}.gap12{gap:12px}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}
.w-full{width:100%}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{border:none;border-top:1px solid var(--rule);margin:16px 0}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block}
@media(max-width:900px){
  #sidebar{width:56px!important}
  .sb-label,.sb-logo-text,.sb-section,.sb-badge{opacity:0!important;width:0!important;overflow:hidden}
  .grid-4,.kb-board{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr}
}
@media print{
  /* ── ocultar interface ── */
  #sidebar,#topbar,
  .chip,button,select,
  .btn,.btn-icon,.btn-ghost,.btn-primary,
  .sb-item,.modal-root,
  #rel-print ~ *,
  div[style*="seletor"],
  div.card:not(#rel-print):not(#rel-print *){
    display:none!important;
  }

  /* ── reset de layout ── */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  html,body{width:100%!important;height:auto!important;overflow:visible!important;margin:0!important;padding:0!important;background:#fff!important;}
  #shell,#main,#content{display:block!important;width:100%!important;height:auto!important;overflow:visible!important;padding:0!important;margin:0!important;position:static!important;}

  /* ── garante que só o relatório apareça ── */
  #content > *:not(:has(#rel-print)),
  div[style*="max-width:860px"] > .card:first-child{display:none!important;}

  /* ── o próprio documento ── */
  #rel-print{
    display:block!important;
    width:100%!important;
    max-width:100%!important;
    border:none!important;
    border-radius:0!important;
    box-shadow:none!important;
    overflow:visible!important;
    page-break-inside:auto;
  }

  /* ── controle de quebras de página ── */
  section{page-break-inside:avoid;break-inside:avoid;}
  .pipe-area,.card{page-break-inside:avoid;break-inside:avoid;}
  h1,h2,h3,div[style*="border-bottom:2px solid"]{page-break-after:avoid;break-after:avoid;}
  tr{page-break-inside:avoid;break-inside:avoid;}

  /* ── cores para impressão ── */
  .dark{
    --ink:#0d0d14!important;--ink2:#3a3a4e!important;--ink3:#6e6e82!important;
    --rule:#e8e6f0!important;--wash:#f6f5fb!important;--page:#fff!important;
    --accent:#7c3aed!important;--aclt:#f5f3ff!important;
  }
  :root{
    --ink:#0d0d14!important;--ink2:#3a3a4e!important;--ink3:#6e6e82!important;
    --rule:#e8e6f0!important;--wash:#f6f5fb!important;--page:#fff!important;
  }

  /* ── tipografia e espaçamento ── */
  body{font-size:11pt!important;}
  #rel-print div[style*="padding:30px"]{padding:16px 20px!important;}
  #rel-print div[style*="padding:32px"]{padding:16px 20px!important;}

  /* ── forçar tabelas a não cortarem ── */
  table{width:100%!important;page-break-inside:auto;}
  thead{display:table-header-group;}
  tfoot{display:table-footer-group;}

  /* ── configuração de página ── */
  @page{
    size:A4 portrait;
    margin:12mm 14mm 12mm 14mm;
  }
}
</style>
</head>
<body>

<div id="shell">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"></path></svg>
      </div>
      <div class="sb-logo-text">Observatório<br><span style="font-weight:400;font-size:10px;opacity:.6">SMDF · DF</span></div>
    </div>

    <div class="sb-nav">
      <div class="sb-section">GESTÃO</div>
      <button class="sb-item active" data-view="demandas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="6" height="6" rx="1"></rect><rect x="3" y="13" width="6" height="6" rx="1"></rect><path d="M13 5h8M13 9h6M13 13h8M13 17h6"></path></svg>
        <span class="sb-label">Demandas</span>
        <span class="sb-badge" id="badge-late" style="display:none">0</span>
      </button>
      <button class="sb-item" data-view="kanban">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"></rect><rect x="10" y="3" width="5" height="13" rx="1"></rect><rect x="17" y="3" width="5" height="9" rx="1"></rect></svg>
        <span class="sb-label">Kanban</span>
      </button>
      <button class="sb-item" data-view="calendario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        <span class="sb-label">Calendário</span>
      </button>

      <div class="sb-section">ANÁLISE</div>
      <button class="sb-item" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"></path></svg>
        <span class="sb-label">Dashboard</span>
      </button>
      <button class="sb-item" data-view="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        <span class="sb-label">Atualização</span>
      </button>
      <button class="sb-item" data-view="relatorio">

// DATABASE — IndexedDB robusto (fallback)
// ══════════════════════════════════════════════════════════
const DB_NAME='obs_v2', DB_VER=1;
let _db=null;

function getDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      ['tasks','config','atu','contatos'].forEach(s=>{
        if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'k'});
      });
    };
    r.onsuccess=e=>{ _db=e.target.result; res(_db); };
    r.onerror=()=>rej(r.error);
  });
}

async function dbAll(store){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const r=db.transaction(store,'readonly').objectStore(store).getAll();
    r.onsuccess=()=>res(r.result||[]);
    r.onerror=()=>rej(r.error);
  });
}
async function dbGet(store,key){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const r=db.transaction(store,'readonly').objectStore(store).get(key);
    r.onsuccess=()=>res(r.result?r.result.v:null);
    r.onerror=()=>rej(r.error);
  });
}
async function dbSet(store,key,val){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const r=db.transaction(store,'readwrite').objectStore(store).put({k:key,v:val});
    r.onsuccess=()=>res();
    r.onerror=()=>rej(r.error);
  });
}
async function dbDel(store,key){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const r=db.transaction(store,'readwrite').objectStore(store).delete(key);
    r.onsuccess=()=>res();
    r.onerror=()=>rej(r.error);
  });
}
async function dbClear(store){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const r=db.transaction(store,'readwrite').objectStore(store).clear();
    r.onsuccess=()=>res();
    r.onerror=()=>rej(r.error);
  });
}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'';
const fmtFull=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
const daysTo=d=>{if(!d)return null;const n=new Date();n.setHours(0,0,0,0);const t=new Date(d);t.setHours(0,0,0,0);return Math.ceil((t-n)/864e5);};
const gs=v=>STATUS.find(s=>s.v===v)||STATUS[0];
const gp=v=>PRIO.find(p=>p.v===v)||PRIO[2];
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const atuDef=()=>({pi:'pendente',pe:'pendente',bi:'pendente',po:'pendente',anoBIde:'',triBIate:'',anoPoDE:'',triPOate:'',obs:'',anoBIate:'',anoPOate:''});
const atuKey=(si,ii,ano)=>`${si}_${ii}_${ano||ST.atuAno||new Date().getFullYear()}`;
const atuGet=(si,ii,ano)=>{
  const k=atuKey(si,ii,ano);
  if(ST.atu[k]) return ST.atu[k];
  // fallback: chave legada sem ano (dados anteriores à feature)
  if(ST.atu[`${si}_${ii}`]) return ST.atu[`${si}_${ii}`];
  return atuDef();
};

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<span>${type==='ok'?'✅':type==='err'?'❌':'ℹ️'}</span><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},3000);
}

let _sharedMode = false;
let _sharedFileName = 'observatorio-smdf.html';

async function restoreSharedHandle(){
  try {
    const mode = await dbGet('config','sharedMode');
    const nome = await dbGet('config','sharedFileName');
    if(nome) _sharedFileName = nome;
    if(mode){ _sharedMode=true; updateSharedStatus(true); }
  } catch(e){}
}

async function connectSharedFile(){
  const nome = prompt('Nome do arquivo na pasta compartilhada (sem .html):', 'observatorio-smdf');
  if(!nome) return;
  _sharedFileName = nome.replace(/\.html$/i,'') + '.html';
  _sharedMode = true;
  await dbSet('config','sharedMode', true);
  await dbSet('config','sharedFileName', _sharedFileName);
  updateSharedStatus(true);
  toast('Modo pasta ativado! Use o botão "Baixar" para salvar na pasta.');
  renderView();
}

async function disconnectSharedFile(){
  _sharedMode = false;
  await dbDel('config','sharedMode');
  updateSharedStatus(false);
  toast('Modo pasta desativado.');
  renderView();
}

async function autoSaveToShared(){
  updateSharedStatus(true,'saving');
  try {
    const src = window.__OBS_SRC;
    if(!src || !src.includes('__INJECT_DATA__')){ exportHTML(); updateSharedStatus(true,'saved'); return; }
    const snap = JSON.stringify({tasks:ST.tasks,atu:ST.atu,cts:ST.cts,mariaMem:ST.mariaMem,feriados:ST.feriados||{},dark:ST.dark,exportedAt:new Date().toISOString()});
    const REPLACEMENT = 'const EMBEDDED_DATA = ' + snap + '; // __INJECT_DATA__';
    const updated = src.replace(/const EMBEDDED_DATA = [\s\S]*?; \/\/ __INJECT_DATA__/, REPLACEMENT);
    const blob = new Blob([updated],{type:'text/html;charset=utf-8'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=_sharedFileName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    ST.lastSaved = new Date();
    setSaveState('saved');
    updateSharedStatus(true,'saved');
    toast('Arquivo baixado — mova para a pasta compartilhada.');
  } catch(e){
    updateSharedStatus(true,'error');
    toast('Erro: '+e.message,'err');
  }
}

function updateSharedStatus(connected, state){
  const el = document.getElementById('shared-status');
  if(!el) return;
  if(!connected){ el.innerHTML=''; return; }
  const isSaving=state==='saving', isError=state==='error';
  el.innerHTML='<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:'+(isError?'#fee2e2':isSaving?'#fef3c7':'#d1fae5')+';color:'+(isError?'#dc2626':isSaving?'#92400e':'#059669')+';cursor:pointer" onclick="autoSaveToShared()" title="Clique para baixar o arquivo atualizado">'+(isError?'⚠️':isSaving?'⏳':'💾')+' '+(isError?'Erro':isSaving?'Gerando...':'Salvar na pasta')+'</span>';
}

function setSaveState(state){
  const dot=document.getElementById('save-dot');
  const lbl=document.getElementById('save-label');
  const dlBtn=document.getElementById('btn-download');
  if(!dot)return;
  if(state==='saved'){
    dot.className='save-dot';
    lbl.textContent=ST.lastSaved?'Salvo '+ST.lastSaved.toLocaleTimeString('pt-BR'):'Salvo';
  } else {
    dot.className='save-dot unsaved';
    lbl.textContent='Salvando...';
  }
  // Mostra botão de download sempre que há dados (dentro do Claude.ai)
  if(dlBtn) dlBtn.style.display = ST.tasks.length>0 ? '' : 'none';
}

// Chamado após qualquer alteração — sinaliza que há dados novos para baixar
function markDirty(){
  const dlBtn=document.getElementById('btn-download');
  if(dlBtn){
    dlBtn.style.display='';
    dlBtn.style.background='#dc2626';
    dlBtn.style.borderColor='#dc2626';
    dlBtn.textContent='⬇️ Baixar atualizado';
  }
  const dot=document.getElementById('save-dot');
  if(dot) dot.className='save-dot unsaved';
}

async function saveTask(t){
  t.updatedAt=new Date().toISOString();
  if(!t.createdAt) t.createdAt=t.updatedAt;
  if(modo()==='supabase'){
    const {error} = await getSupa().from('tasks').upsert({
      id:t.id, data:t, updated_at:t.updatedAt
    });
    if(error){ toast('Erro ao salvar: '+error.message,'err'); return; }
  }
  await dbSet('tasks',t.id,t); // cache local
  const idx=ST.tasks.findIndex(x=>x.id===t.id);
  if(idx>-1)ST.tasks[idx]=t; else ST.tasks.unshift(t);
  ST.lastSaved=new Date();
  setSaveState('saved');
  markDirty();
}
async function deleteTask(id){
  if(modo()==='supabase'){
    await getSupa().from('tasks').delete().eq('id',id);
  }
  await dbDel('tasks',id);
  ST.tasks=ST.tasks.filter(t=>t.id!==id);
  ST.lastSaved=new Date();
  markDirty();
}
async function saveCfg(k,v){
  await dbSet('config',k,v);
  if(modo()==='supabase'){
    await getSupa().from('config').upsert({id:k,data:v,updated_at:new Date().toISOString()});
  }
}

async function saveSupaConfig(){
  const url = document.getElementById('supa-url')?.value?.trim();
  const key = document.getElementById('supa-key')?.value?.trim();
  if(!url||!key){ toast('Preencha URL e Chave','err'); return; }
  if(!url.startsWith('https://')){ toast('URL inválida — deve começar com https://','err'); return; }
  // Salva no IndexedDB local para persistir
  await dbSet('config','supaUrl',url);
  await dbSet('config','supaKey',key);
  toast('Configuração salva! Recarregando...','ok');
  setTimeout(()=>location.reload(),1200);
}

  }
  await dbSet('atu',key,up);
  ST.lastSaved=new Date();
  setSaveState('saved');

}

async function loadAll(){
  // Se arquivo tem dados embutidos (vindo do chat), usa e persiste no IndexedDB
  if(typeof EMBEDDED_DATA !== 'undefined' && EMBEDDED_DATA !== null){
    const d = EMBEDDED_DATA;
    ST.tasks = (d.tasks||[]).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    ST.atu   = d.atu   || {};
    ST.cts   = d.cts   || {};
    ST.mariaMem = d.mariaMem || {notas:[],chatLog:[]};
    if(d.feriados) ST.feriados=d.feriados;
    if(d.dark !== undefined){ ST.dark=d.dark; document.documentElement.classList.toggle('dark',d.dark); }
    // Grava no IndexedDB para uso offline contínuo
    await dbClear('tasks');
    await dbClear('atu');
    await dbClear('contatos');
    for(const t of ST.tasks) await dbSet('tasks', t.id, t);
    for(const [k,v] of Object.entries(ST.atu)) await dbSet('atu', k, v);
    for(const [k,v] of Object.entries(ST.cts)) await dbSet('contatos', k, v);
    if(d.mariaMem) await dbSet('config','mariaMem',d.mariaMem);
    ST.lastSaved = new Date();
    return;
  }
  // Modo normal: IndexedDB
  const tasks = await dbAll('tasks');
  ST.tasks = tasks.map(r=>r.v).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  const atu = await dbAll('atu');
  ST.atu={}; atu.forEach(r=>{ ST.atu[r.k]=r.v; });
  const cts = await dbAll('contatos');
  ST.cts={}; cts.forEach(r=>{ ST.cts[r.k]=r.v; });
  // Carrega credenciais Supabase salvas
  const supaUrl = await dbGet('config','supaUrl');
  const supaKey = await dbGet('config','supaKey');
  if(supaUrl && supaKey && SUPA_URL==='COLE_AQUI_A_URL_DO_SUPABASE'){
    // Injeta dinamicamente as credenciais salvas
    window._supaUrlRuntime = supaUrl;
    window._supaKeyRuntime = supaKey;
    if(!_supa){
      try { _supa = window.supabase.createClient(supaUrl, supaKey); } catch(e){}
    }
  }
  const dark = await dbGet('config','dark'); if(dark!==null){ ST.dark=dark; document.documentElement.classList.toggle('dark',dark); }
  await restoreSharedHandle();
  const mem  = await dbGet('config','mariaMem'); if(mem) ST.mariaMem=mem;
  const key  = await dbGet('config','apiKey');   if(key) ST.apiKey=key;
  const fer  = await dbGet('config','feriados'); if(fer) ST.feriados=fer;
  if(ST.tasks.length===0 && modo()==='local'){ for(const t of SEED) await saveTask(t); }
  showModoStatus();
  // Testa conexão Supabase e mostra resultado
  if(modo()==='supabase'){
    const {data, error} = await getSupa().from('tasks').select('id').limit(1);
    if(error){
      console.error('Supabase erro:', error);
      toast('Supabase: '+error.message,'err');
    } else {
      console.log('Supabase conectado!', data);
      toast('🌐 Supabase conectado — dados em tempo real!');
    }
  }
  ST.lastSaved = new Date();
}

// Filtra tarefas por mês/ano de prazo (deadline)
// mes=-1 = todos os meses
function filteredByMes(tasks, mes, ano){
  if(mes===-1) return tasks; // sem filtro
  return tasks.filter(t=>{
    if(!t.deadline) return false;
    const d=new Date(t.deadline+'T12:00:00');
    return d.getFullYear()===parseInt(ano) && d.getMonth()===parseInt(mes);
  });
}

function filtered(){
  const base = ST.tasks.filter(t=>{
    const pm=ST.fPerson==='all'||t.person===ST.fPerson;
    const cm=ST.fCat==='all'||t.category===ST.fCat;
    const sm=ST.fStatus==='all'||t.status===ST.fStatus;
    const qm=!ST.search||t.title.toLowerCase().includes(ST.search.toLowerCase())||(t.notes||'').toLowerCase().includes(ST.search.toLowerCase());
    const mm=ST.fMes===-1||(()=>{
      if(!t.deadline)return false;
      const d=new Date(t.deadline+'T12:00:00');
      return d.getFullYear()===parseInt(ST.fAno)&&d.getMonth()===parseInt(ST.fMes);
    })();
    return pm&&cm&&sm&&qm&&mm;
  });
  // Concluídas sempre no final, resto ordenado por urgência (atrasadas > urgente > prazo próximo)
  const ativas   = base.filter(t=>t.status!=='concluido').sort((a,b)=>{
    const da=daysTo(a.deadline), db=daysTo(b.deadline);
    // Atrasadas primeiro
    if(da!==null&&da<0 && (db===null||db>=0)) return -1;
    if(db!==null&&db<0 && (da===null||da>=0)) return 1;
    // Por prioridade
    const pOrd={urgente:0,alta:1,media:2,baixa:3};
    const pa=pOrd[a.priority]??2, pb=pOrd[b.priority]??2;
    if(pa!==pb) return pa-pb;
    // Por prazo
    if(da!==null&&db!==null) return da-db;
    if(da!==null) return -1;
    if(db!==null) return 1;
    return 0;
  });
  const concl    = base.filter(t=>t.status==='concluido')
    .sort((a,b)=>new Date(b.concluidoEm||b.updatedAt)-new Date(a.concluidoEm||a.updatedAt));
  return [...ativas, ...concl];
}

          rows.push('<div style="display:flex;align-items:center;gap:10px;margin:12px 0 6px"><div style="flex:1;height:1px;background:var(--rule)"></div><span style="font-size:11px;font-weight:700;color:var(--ok);white-space:nowrap;display:flex;align-items:center;gap:5px">✅ Concluídas</span><div style="flex:1;height:1px;background:var(--rule)"></div></div>');
        }
        rows.push(taskRow(t));
      }
      return rows.join('');
    })()}
  </div>`;
}

function taskRow(t){
  const st=gs(t.status),pr=gp(t.priority),d=daysTo(t.deadline);
  const dc=d===null?'var(--ink3)':d<0?'var(--err)':d<=3?'var(--warn)':'var(--ink3)';
  const team=TEAM.find(m=>m.name===t.person);
  return `
  <div class="card" style="cursor:pointer;transition:all .15s;margin-bottom:8px" onclick="openDetail('${t.id}')" onmouseenter="this.style.boxShadow='var(--sh2)'" onmouseleave="this.style.boxShadow='var(--sh)'">
    <div class="flex items-center gap8" style="flex-wrap:wrap">
      <div style="width:6px;height:36px;border-radius:3px;background:${pr.c};flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div class="flex items-center gap8 mb4" style="flex-wrap:wrap">
          <span style="font-size:14px;font-weight:700;flex:1" class="ellipsis">${esc(t.title)}</span>
          <span class="badge" style="background:${st.bg};color:${st.c}">${st.l}</span>
          <span class="tag" style="background:${pr.c}18;color:${pr.c}">${pr.l}</span>
        </div>
        <div class="flex gap8 text-sub" style="flex-wrap:wrap;font-size:12px">
          ${team?`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:18px;height:18px;border-radius:50%;background:${team.color};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700">${team.emoji}</span>${esc(t.person)}</span>`:''}
          <span>📂 ${esc(t.category)}</span>
          ${t.deadline?`<span style="color:${dc};font-weight:${d!==null&&d<=3?700:400}">📅 ${fmt(t.deadline)} ${d!==null?`(${d}d)`:''}</span>`:''}
          ${t.sei?`<span style="font-family:var(--mono);font-size:11px">SEI: ${esc(t.sei)}</span>`:''}
        </div>
        ${t.notes?`<div class="text-sub mt4" style="font-size:12px;line-height:1.4">${esc(t.notes).substring(0,140)}${t.notes.length>140?'…':''}</div>`:''}
      </div>
    </div>
  </div>`;
}

// ── Feriados e Pontos Facultativos ─────────────────────
// Armazenados em ST.feriados = { 'YYYY-MM-DD': {tipo:'feriado'|'facultativo', nome:'...'} }
function getFeriado(ds){ return (ST.feriados||{})[ds]||null; }

async function saveFeriado(ds, tipo, nome){
  if(!ST.feriados) ST.feriados={};
  if(!tipo){ delete ST.feriados[ds]; }
  else { ST.feriados[ds]={tipo,nome}; }
  await dbSet('config','feriados',ST.feriados);
  markDirty();
  ST.calDay=ds;
  renderView();
}

function openFeriadoModal(ds){
  if(!ST.admin){ toast('Apenas Admin pode gerenciar feriados','err'); return; }
  const f=getFeriado(ds)||{tipo:'feriado',nome:''};
  const fmtDS=fmtFull(ds);
  openModal(`<div class="modal" style="max-width:440px">
    <div class="modal-hdr">
      <div class="modal-title">📅 ${fmtDS}</div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="lbl">Tipo</label>
        <select class="inp" id="fer-tipo">
          <option value="">— Nenhum —</option>
          <option value="feriado" ${f.tipo==='feriado'?'selected':''}>🔴 Feriado Nacional/Distrital</option>
          <option value="estadual" ${f.tipo==='estadual'?'selected':''}>🟠 Feriado Estadual</option>
          <option value="facultativo" ${f.tipo==='facultativo'?'selected':''}>🟡 Ponto Facultativo</option>
          <option value="recesso" ${f.tipo==='recesso'?'selected':''}>🔵 Recesso</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl">Nome / Descrição</label>
        <input class="inp" id="fer-nome" value="${esc(f.nome||'')}" placeholder="Ex: Tiradentes, Carnaval, Recesso de fim de ano..."/>
      </div>
    </div>
    <div class="modal-foot">
      ${f.tipo?`<button class="btn btn-danger btn-sm" onclick="saveFeriado('${ds}',null,null).then(closeModal)">🗑️ Remover</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveFeriado('${ds}',document.getElementById('fer-tipo').value,document.getElementById('fer-nome').value).then(closeModal)">Salvar</button>
    </div>
  </div>`);
}

// ── Drag & Drop de demandas no calendário ──────────────
async function calDrop(event, newDate){
  event.preventDefault();
  const id = ST.calDrag || event.dataTransfer.getData('text');
  if(!id){ ST.calDrag=null; return; }
  const t = ST.tasks.find(t=>t.id===id);
  if(!t){ ST.calDrag=null; return; }
  if(t.deadline === newDate){ ST.calDrag=null; return; } // sem mudança

  const oldDate = t.deadline ? fmtFull(t.deadline) : 'sem prazo';
  const newDateFmt = fmtFull(newDate);

  // Confirma visualmente antes de salvar
  const up = {...t, deadline: newDate, updatedAt: new Date().toISOString()};
  await saveTask(up);
  ST.calDrag = null;
  ST.calDay  = newDate; // abre o dia de destino
  renderView();
  toast('📅 "'+t.title.substring(0,30)+(t.title.length>30?'…':'')+'" movida para '+newDateFmt);
}


function vCalendario(){
  const {y,m}=ST.calMon;
  const fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const mn=new Date(y,m).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase();

  // Estatísticas do mês
  const mesStr=`${y}-${String(m+1).padStart(2,'0')}`;
  const tMes=ST.tasks.filter(t=>t.deadline&&t.deadline.startsWith(mesStr));

  // Conta feriados do mês
  const ferMes=Object.entries(ST.feriados||{})
    .filter(([k])=>k.startsWith(mesStr));
  const ferCount=ferMes.filter(([,v])=>v.tipo==='feriado'||v.tipo==='estadual').length;
  const facCount=ferMes.filter(([,v])=>v.tipo==='facultativo').length;
  const recCount=ferMes.filter(([,v])=>v.tipo==='recesso').length;

  const FER_STYLE={
    feriado:    {bg:'#fee2e2',border:'#fca5a5',label:'Feriado',         dot:'#dc2626'},
    estadual:   {bg:'#fff7ed',border:'#fdba74',label:'Feriado Est.',    dot:'#f97316'},
    facultativo:{bg:'#fefce8',border:'#fde047',label:'Pto. Facultativo',dot:'#ca8a04'},
    recesso:    {bg:'#eff6ff',border:'#93c5fd',label:'Recesso',         dot:'#2563eb'},
  };

  // Tarefas em andamento com span de dias
  // Aparecem desde o deadline até hoje (ou concluidoEm se já concluída)
  function taskSpanDs(t){
    if(t.status!=='andamento') return null;
    if(!t.deadline) return null;
    const inicio = new Date(t.deadline+'T00:00:00');
    const fim    = new Date(); fim.setHours(0,0,0,0); // hoje
    if(inicio >= fim) return null; // prazo ainda no futuro, não precisa de span
    return {inicio, fim};
  }

  // Monta set de ds (YYYY-MM-DD) em que cada tarefa "em andamento" aparece além do deadline
  const spanMap = {}; // ds -> [taskId]
  ST.tasks.forEach(t=>{
    const span = taskSpanDs(t);
    if(!span) return;
    const cur = new Date(span.inicio); cur.setDate(cur.getDate()+1); // dia seguinte ao deadline
    while(cur <= span.fim){
      const ds = cur.toISOString().slice(0,10);
      if(!spanMap[ds]) spanMap[ds]=[];
      spanMap[ds].push(t.id);
      cur.setDate(cur.getDate()+1);
    }
  });

  let cells='';
  for(let i=0;i<fd;i++) cells+=`<div style="min-height:110px;max-height:140px;background:transparent;border-radius:8px"></div>`;

  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const td=new Date(y,m,d);td.setHours(0,0,0,0);
    const diaSem=td.getDay(); // 0=dom, 6=sab
    const isT=td.getTime()===today.getTime();
    const isSel=ST.calDay===ds;
    const isWknd=diaSem===0||diaSem===6;
    const feriado=getFeriado(ds);
    const fs=feriado?FER_STYLE[feriado.tipo]||FER_STYLE.feriado:null;
    const dtAtivas=ST.tasks.filter(t=>t.deadline===ds&&t.status!=='concluido');
    const dtConc=ST.tasks.filter(t=>t.deadline===ds&&t.status==='concluido');
    // tarefas em andamento que "transbordam" para este dia
    const dtSpan=(spanMap[ds]||[]).map(id=>ST.tasks.find(t=>t.id===id)).filter(Boolean);
    const dt=[...dtAtivas,...dtSpan,...dtConc];
    const hasLate=dtAtivas.some(t=>daysTo(t.deadline)<0);

    // Cores de fundo do dia
    let dayBg=fs?fs.bg:isWknd?'var(--wash)':'var(--page)';
    let dayBorder=fs?`2px solid ${fs.border}`:isT?`2px solid var(--accent)`:isSel?`2px solid var(--accent)`:`1px solid var(--rule)`;
    let dayOp=td<today&&!dt.length&&!isT&&!feriado?'.5':'1';

    cells+=`<div
      style="min-height:110px;max-height:140px;overflow:hidden;background:${dayBg};border:${dayBorder};border-radius:8px;padding:7px;cursor:pointer;transition:all .15s;opacity:${dayOp}"
      onclick="ST.calDay=ST.calDay==='${ds}'?null:'${ds}';renderView()"
      ondblclick="openFeriadoModal('${ds}')"
      ondragover="event.preventDefault();this.style.boxShadow='inset 0 0 0 2px var(--accent)';this.style.background='var(--aclt)'"
      ondragleave="this.style.boxShadow='';this.style.background='${dayBg}'"
      ondrop="this.style.boxShadow='';this.style.background='${dayBg}';calDrop(event,'${ds}')"
      title="${feriado?feriado.nome:''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:13px;font-weight:800;color:${isT?'var(--accent)':fs?fs.dot:isWknd?'var(--ink3)':'var(--ink3)'}">${d}</span>
        <div style="display:flex;gap:3px;align-items:center">
          ${feriado?`<span style="font-size:9px;font-weight:700;color:${fs.dot};background:${fs.bg};border:1px solid ${fs.border};border-radius:4px;padding:1px 5px;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis">${fs.label}</span>`:''}
          ${dt.length?`<span style="width:18px;height:18px;border-radius:50%;background:${hasLate?'var(--err)':'var(--accent)'};color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${dt.length}</span>`:''}
        </div>
      </div>
      ${feriado&&feriado.nome?`<div style="font-size:9px;font-weight:600;color:${fs.dot};margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(feriado.nome)}</div>`:''}
      ${dt.slice(0,feriado?2:3).map(t=>{
        const pr=gp(t.priority);
        const isDone=t.status==='concluido';
        const isSpan=dtSpan.includes(t)&&t.deadline!==ds; // dia de span (não o deadline)
        const spanStyle=isSpan
          ? `background:${pr.c}22;color:${pr.c};border:1.5px dashed ${pr.c};border-left:4px solid ${pr.c}`
          : isDone
            ? 'background:#d1fae520;color:#059669;border:1px solid #059669;text-decoration:line-through;opacity:.7'
            : `background:${pr.c}15;color:${pr.c};border:1px solid ${pr.c}30`;
        return`<div
          draggable="true"
          ondragstart="event.stopPropagation();ST.calDrag='${t.id}';event.dataTransfer.effectAllowed='move'"
          ondragend="ST.calDrag=null"
          onclick="event.stopPropagation();openDetail('${t.id}')"
          style="margin-top:2px;padding:3px 6px;border-radius:4px;font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${spanStyle};cursor:grab;transition:opacity .15s"
          title="${esc(t.title)}${isDone?' ✓ Concluída':isSpan?' ⏳ Em andamento (span)':''} — arraste para mudar a data"
        >${isDone?'✓ ':isSpan?'⏳ ':''}${esc(t.title)}</div>`;
      }).join('')}
      ${dt.length>(feriado?2:3)?`<div style="font-size:9px;color:var(--ink3)">+${dt.length-(feriado?2:3)} mais</div>`:''}
    </div>`;
  }

  // Detalhe do dia selecionado
  const dayDetail=ST.calDay?`
    <div class="card" style="margin-top:14px;border-left:3px solid var(--accent)">
      <div class="card-hdr">
        <div>
          <div class="card-title">📅 ${fmtFull(ST.calDay)}</div>
          ${getFeriado(ST.calDay)?`<div style="font-size:11px;color:${FER_STYLE[getFeriado(ST.calDay).tipo]?.dot||'#d97706'};font-weight:600;margin-top:2px">
            ${FER_STYLE[getFeriado(ST.calDay).tipo]?.label||'Feriado'}: ${esc(getFeriado(ST.calDay).nome||'')}
          </div>`:''}
        </div>
        <div style="display:flex;gap:6px">
          ${ST.admin?`<button class="btn btn-ghost btn-sm" onclick="openFeriadoModal('${ST.calDay}')">
            ${getFeriado(ST.calDay)?'✏️ Editar feriado':'+ Marcar feriado'}
          </button>`:''}
          <button class="btn btn-primary btn-sm" onclick="openForm()">+ Nova demanda</button>
        </div>
      </div>
      ${ST.tasks.filter(t=>t.deadline===ST.calDay).map(t=>{
        const st=gs(t.status),pr=gp(t.priority);
        return`<div
          draggable="true"
          ondragstart="ST.calDrag='${t.id}';event.dataTransfer.effectAllowed='move'"
          ondragend="ST.calDrag=null"
          style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);cursor:grab;opacity:${t.status==='concluido'?'.6':'1'}"
          onclick="openDetail('${t.id}')"
          title="Arraste para mover para outro dia">
          <div style="width:4px;height:36px;border-radius:2px;background:${pr.c};flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;${t.status==='concluido'?'text-decoration:line-through;color:var(--ink3)':''}">${t.status==='concluido'?'✓ ':''}${esc(t.title)}</div>
            <div style="font-size:11px;color:var(--ink3)">${esc(t.person||'—')} · ${esc(t.category)}</div>
          </div>
          <span class="badge" style="background:${st.bg};color:${st.c}">${st.l}</span>
        </div>`;
      }).join('')||`<p style="color:var(--ink3);font-size:12px;padding:8px 0">
        ${getFeriado(ST.calDay)?'Dia sem expediente — nenhuma demanda registrada.':'Nenhuma demanda nesta data.'}
      </p>`}
    </div>`:'';

  return `<div>
    <!-- Stats do mês -->
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px">
      ${[
        {n:tMes.length,                                          l:'Demandas',      c:'var(--accent)'},
        {n:tMes.filter(t=>t.status==='concluido').length,        l:'Concluídas',    c:'var(--ok)'},
        {n:tMes.filter(t=>t.status!=='concluido').length,        l:'Em aberto',     c:'var(--blue)'},
        {n:tMes.filter(t=>t.status!=='concluido'&&t.deadline&&daysTo(t.deadline)<0).length, l:'Atrasadas', c:'var(--err)'},
        {n:ferCount, l:'Feriados', c:'#dc2626'},
        {n:facCount+recCount, l:'Fac./Recesso', c:'#ca8a04'},
      ].map(s=>`<div class="stat"><div class="stat-n" style="color:${s.c};font-size:22px">${s.n}</div><div class="stat-l">${s.l}</div></div>`).join('')}
    </div>

    <div class="card">
      <!-- Navegação -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="navCal(-1)">◀ Anterior</button>
        <div style="text-align:center;flex:1">
          <div style="font-size:16px;font-weight:800">${mn}</div>
          <div style="font-size:11px;color:var(--ink3)">${tMes.length} demanda(s) · ${ferCount+facCount+recCount} dia(s) sem expediente</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="navCal(1)">Próximo ▶</button>
      </div>
      <!-- Atalho rápido mês/ano -->
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 14px;background:var(--wash);border-radius:8px;border:1px solid var(--rule)">
        <span style="font-size:11px;font-weight:700;color:var(--ink3)">Ir para:</span>
        <select style="padding:5px 9px;border-radius:7px;border:1.5px solid var(--rule);background:var(--page);color:var(--ink);font-size:12px;outline:none;font-weight:600"
          onchange="ST.calMon.m=parseInt(this.value);ST.calDay=null;renderView()">
          ${['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'].map((mes,i)=>
            `<option value="${i}" ${i===m?'selected':''}>${mes}</option>`).join('')}
        </select>

  <div>

// VIEW: RELATÓRIO
// ══════════════════════════════════════════════════════════
function vRelatorio(){
  // ── Período selecionado ───────────────────────────────
  const hoje = new Date();
  if(!ST.relPeriodo) ST.relPeriodo = 'mensal';
  if(!ST.relMes)     ST.relMes     = hoje.getMonth();
  if(!ST.relAno)     ST.relAno     = hoje.getFullYear();
  if(!ST.relSem)     ST.relSem     = hoje.getMonth()<6?1:2;

  const periodo   = ST.relPeriodo;
  const mesIdx    = parseInt(ST.relMes);
  const ano       = parseInt(ST.relAno);
  const semestre  = parseInt(ST.relSem);

  const ANOS_DISP = [];
  for(let y=2024;y<=hoje.getFullYear()+1;y++) ANOS_DISP.push(y);
  const MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // ── Filtra tarefas pelo período ───────────────────────
  function dentroPeríodo(t){
    const ref = t.createdAt || t.updatedAt || '';
    if(!ref) return false;
    const d = new Date(ref);
    const ty = d.getFullYear(), tm = d.getMonth();
    if(periodo==='mensal')   return ty===ano && tm===mesIdx;
    if(periodo==='semestral')return ty===ano && (semestre===1?tm<6:tm>=6);
    if(periodo==='anual')    return ty===ano;
    return false;
  }
  function concluidoNoPeriodo(t){
    const ref = t.concluidoEm || t.updatedAt || '';
    if(!ref||t.status!=='concluido') return false;
    const d = new Date(ref);
    const ty = d.getFullYear(), tm = d.getMonth();
    if(periodo==='mensal')   return ty===ano && tm===mesIdx;
    if(periodo==='semestral')return ty===ano && (semestre===1?tm<6:tm>=6);
    if(periodo==='anual')    return ty===ano;
    return false;
  }

  // ── Filtro por deadline (data real do evento/prazo) ──
  function deadlineNoPeriodo(t){
    const ref = t.deadline || '';
    if(!ref) return false;
    const d = new Date(ref+'T00:00:00');
    const ty = d.getFullYear(), tm = d.getMonth();
    if(periodo==='mensal')   return ty===ano && tm===mesIdx;
    if(periodo==='semestral')return ty===ano && (semestre===1?tm<6:tm>=6);
    if(periodo==='anual')    return ty===ano;
    return false;
  }

  // TODAS as tarefas filtradas pelo deadline (data da ação), não pela data de criação
  const tPeriodo   = ST.tasks.filter(deadlineNoPeriodo);
  const conclPer   = ST.tasks.filter(t=>t.status==='concluido'&&deadlineNoPeriodo(t));

  const catReu     = ['Reunião Comitê Gestor','Reunião/Evento Externo','Articulação com órgão'];
  const reunioes   = tPeriodo.filter(t=>catReu.includes(t.category));
  const prodAtu    = tPeriodo.filter(t=>['Atualização Site Observatório','Atualização Painel BI','Atualização trimestral (Comitê)','Atualização mensal (SMDF)'].includes(t.category));
  const demandasG  = tPeriodo.filter(t=>['Demanda do Gabinete','Relatório/Nota Técnica','Ofício/Memorando','Resposta a órgão de controle'].includes(t.category));
  const acoes      = tPeriodo.filter(t=>['Gestão Administrativa'].includes(t.category));

  // ── Label do período ──────────────────────────────────
  let periodoLabel = '';
  if(periodo==='mensal')   periodoLabel = MESES_NOME[mesIdx]+' de '+ano;
  if(periodo==='semestral')periodoLabel = (semestre===1?'1º Semestre':'2º Semestre')+' de '+ano;
  if(periodo==='anual')    periodoLabel = 'Exercício '+ano;

  // ── Status pipeline BI e Site — ano mais recente com dados ──
  const ANOS_ATU = [2026,2025,2024,2023]; // mais recente primeiro

  // Para cada indicador: encontra o ano mais recente que tem bi ou po preenchido
  function melhorAnoBI(si,ii){
    for(const y of ANOS_ATU){
      const d=atuGet(si,ii,y);
      if(d.bi==='ok'||d.bi==='verificar') return y;
    }
    // fallback: qualquer ano com algum dado
    for(const y of ANOS_ATU){ const d=atuGet(si,ii,y); if(d.bi&&d.bi!=='pendente') return y; }
    return null;
  }
  function melhorAnoPO(si,ii){
    for(const y of ANOS_ATU){
      const d=atuGet(si,ii,y);
      if(d.po==='ok'||d.po==='verificar') return y;
    }
    for(const y of ANOS_ATU){ const d=atuGet(si,ii,y); if(d.po&&d.po!=='pendente') return y; }
    return null;
  }

  let totBIOk=0,totBIAll=0,totPOOk=0,totPOAll=0;
  const areaStatus = AREAS_ATU.map((a,si)=>{
    const inds = a.inds.map((_,ii)=>{
      // usa o ano mais recente com dados; senão usa o ano corrente
      const anoBI = melhorAnoBI(si,ii) || ANOS_ATU[0];
      const anoPO = melhorAnoPO(si,ii) || ANOS_ATU[0];
      const dBI   = atuGet(si,ii,anoBI);
      const dPO   = atuGet(si,ii,anoPO);
      // status vem do melhor ano disponível
      const bi = dBI.bi||'pendente';
      const po = dPO.po||'pendente';
      if(bi==='ok') totBIOk++;
      if(po==='ok') totPOOk++;
      totBIAll++; totPOAll++;
      // período BI
      const periBI = dBI.anoBIate||dBI.triBIate
        ? `${dBI.triBIate||''} ${dBI.anoBIate||''}`.trim()
        : (dBI.periodBI||'');
      // período Portal
      const periPO = dPO.anoPOate||dPO.triPOate
        ? `${dPO.triPOate||''} ${dPO.anoPOate||''}`.trim()
        : (dPO.periodPO||'');
      return {...dBI, bi, po, nome:a.inds[ii].n, anoBI, anoPO, periBI, periPO};
    });
    return {...a, inds};
  });
  const pctBI   = totBIAll ? Math.round(totBIOk/totBIAll*100) : 0;
  const pctSite = totPOAll ? Math.round(totPOOk/totPOAll*100) : 0;

  const stsATU={ok:'#059669',pendente:'#d97706',ausente:'#dc2626',verificar:'#0284c7'};
  const lblATU={ok:'Atualizado',pendente:'Pendente',ausente:'Ausente',verificar:'Em verificação'};
  const dot=(v)=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${stsATU[v]||'#9ca3af'};margin-right:5px"></span>`;

  // ── Reuniões por tipo e status — SEMPRE pelo deadline (data do evento) ──
  const reunioesRealizadas  = reunioes.filter(t=>t.status==='concluido').sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
  const reunioesPrevistas   = reunioes.filter(t=>t.status!=='concluido').sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
  const reuComite  = reunioesRealizadas.filter(t=>t.category==='Reunião Comitê Gestor');
  const reuExterno = reunioesRealizadas.filter(t=>t.category==='Reunião/Evento Externo');
  const articulac  = reunioesRealizadas.filter(t=>t.category==='Articulação com órgão');

  // ── HTML do relatório ─────────────────────────────────
  return `<div style="max-width:860px;margin:0 auto">

    <!-- SELETOR DE PERÍODO -->
    <div class="card" style="margin-bottom:20px;padding:14px 18px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:700;color:var(--ink3)">PERÍODO:</span>
        <div style="display:flex;gap:6px">
          ${['mensal','semestral','anual'].map(p=>`
            <button onclick="ST.relPeriodo='${p}';renderView()"
              style="padding:5px 14px;border-radius:6px;border:1.5px solid ${periodo===p?'var(--accent)':'var(--rule)'};background:${periodo===p?'var(--aclt)':'none'};color:${periodo===p?'var(--accent)':'var(--ink3)'};font-size:12px;font-weight:700;cursor:pointer">
              ${{mensal:'Mensal',semestral:'Semestral',anual:'Anual'}[p]}
            </button>`).join('')}
        </div>
        ${periodo==='mensal'?`
          <select onchange="ST.relMes=this.value;renderView()" style="padding:5px 10px;border-radius:6px;border:1.5px solid var(--rule);background:var(--wash);color:var(--ink);font-size:12px;outline:none">
            ${MESES_NOME.map((m,i)=>`<option value="${i}" ${i===mesIdx?'selected':''}>${m}</option>`).join('')}
          </select>`:periodo==='semestral'?`
          <select onchange="ST.relSem=this.value;renderView()" style="padding:5px 10px;border-radius:6px;border:1.5px solid var(--rule);background:var(--wash);color:var(--ink);font-size:12px;outline:none">
            <option value="1" ${semestre===1?'selected':''}>1º Semestre (Jan–Jun)</option>
            <option value="2" ${semestre===2?'selected':''}>2º Semestre (Jul–Dez)</option>
          </select>`:''}
        <select onchange="ST.relAno=this.value;renderView()" style="padding:5px 10px;border-radius:6px;border:1.5px solid var(--rule);background:var(--wash);color:var(--ink);font-size:12px;outline:none">
          ${ANOS_DISP.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}
        </select>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="printRelatorio()">🖨️ Imprimir / PDF</button>
          <button class="btn btn-primary btn-sm" onclick="exportHTML()">📤 Exportar HTML</button>
        </div>
      </div>
    </div>

    <!-- RELATÓRIO PARA IMPRESSÃO -->
    <div id="rel-print" style="background:var(--page);border:1px solid var(--rule);border-radius:12px;overflow:hidden">

      <!-- CABEÇALHO INSTITUCIONAL -->
      <div style="background:var(--accent);padding:32px 40px;color:#fff">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap">
          <div>
            <div style="font-size:10px;letter-spacing:.12em;opacity:.7;font-weight:700;text-transform:uppercase;margin-bottom:6px">Governo do Distrito Federal</div>
            <div style="font-size:11px;opacity:.8;font-weight:500;margin-bottom:2px">Secretaria de Estado da Mulher — SMDF</div>
            <div style="font-size:20px;font-weight:900;line-height:1.2">Observatório de Violência<br/>Contra a Mulher e Feminicídio</div>
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25)">
              <div style="font-size:9px;opacity:.65;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px">Secretaria Executiva do Observatório</div>
              <div style="font-size:12px;font-weight:700;opacity:.95">Letícia Araújo</div>
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:10px;letter-spacing:.08em;opacity:.7;text-transform:uppercase;margin-bottom:4px">Relatório Gerencial</div>
            <div style="font-size:16px;font-weight:800">${periodoLabel}</div>
            <div style="font-size:10px;opacity:.6;margin-top:4px">Emitido em ${new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}</div>
            <div style="font-size:10px;opacity:.6">Decreto 45.174/2023</div>
          </div>
        </div>
      </div>

      <div style="padding:32px 40px">

        <!-- SUMÁRIO EXECUTIVO -->
        <div style="margin-bottom:28px">
          <div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:16px">Sumário Executivo</div>
          <p style="font-size:13px;line-height:1.8;color:var(--ink2)">
            O Observatório de Violência Contra a Mulher e Feminicídio do Distrito Federal, coordenado pela SMDF em conjunto com o Comitê Gestor de 8 órgãos distritais, registrou no período de <strong>${periodoLabel}</strong> a realização de <strong>${reunioesRealizadas.length} reunião(ões)/evento(s)</strong> institucionais, <strong>${prodAtu.length} ação(ões) de produção e atualização de dados</strong> e <strong>${demandasG.length} demanda(s) da gestão</strong>. O Painel BI (Qlik Sense) encontra-se <strong>${pctBI}% atualizado</strong> e o Portal do Observatório com <strong>${pctSite}% de atualização</strong>.
          </p>
          <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <a href="https://www.observatoriodamulher.df.gov.br" target="_blank" rel="noopener"
              style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--accent);color:#fff;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none">
              🌐 observatoriodamulher.df.gov.br
            </a>
            <a href="https://observatoriodamulher-paineis.df.gov.br/publico/single/?appid=db2e901d-a463-42fc-bf77-c4651b7b58ec&sheet=9411d269-069d-47a3-a235-9198b55dbbd6&opt=noselections&identity=preview" target="_blank" rel="noopener"
              style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--wash);color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;font-size:12px;font-weight:700;text-decoration:none">
              📊 Painel BI — Qlik Sense
            </a>
          </div>
        </div>

        <!-- ARTICULAÇÃO INSTITUCIONAL -->
        <div style="margin-bottom:28px">
          <div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:16px">1. Articulação Institucional e Reuniões</div>

          ${!reunioes.length?`<p style="font-size:13px;color:var(--ink3);font-style:italic">Nenhuma reunião ou evento com data neste período.</p>`:`
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
            ${[
              {n:reuComite.length,  l:'Reuniões do Comitê Gestor', c:'var(--accent)'},
              {n:reuExterno.length, l:'Eventos e Reuniões Externas',c:'#0891b2'},
              {n:articulac.length,  l:'Articulações com Órgãos',   c:'#059669'},
            ].map(s=>`<div style="background:var(--wash);border-radius:9px;padding:14px;text-align:center;border:1px solid var(--rule)">
              <div style="font-size:28px;font-weight:900;color:${s.c}">${s.n}</div>
              <div style="font-size:10px;color:var(--ink3);margin-top:3px;font-weight:600">${s.l}</div>
            </div>`).join('')}
          </div>

          ${reunioes.length?`<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:6px">
            <thead><tr>
              <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border-bottom:2px solid var(--rule)">Evento / Reunião</th>
              <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border-bottom:2px solid var(--rule)">Tipo</th>
              <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border-bottom:2px solid var(--rule)">Data</th>
              <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border-bottom:2px solid var(--rule)">Nº SEI</th>
              <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border-bottom:2px solid var(--rule)">Recebido em</th>
              <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border-bottom:2px solid var(--rule)">Situação</th>
            </tr></thead>
            <tbody>
              ${reunioes.map(t=>{
                const stc=t.status==='concluido'?'#059669':t.status==='andamento'?'#2563eb':'#d97706';
                const stl=t.status==='concluido'?'Realizada':t.status==='andamento'?'Em andamento':'Prevista';
                return`<tr>
                  <td style="padding:9px 10px;border-bottom:1px solid var(--rule);font-weight:600">${esc(t.title)}</td>
                  <td style="padding:9px 10px;border-bottom:1px solid var(--rule);color:var(--ink3);font-size:11px">${esc(t.category)}</td>
                  <td style="padding:9px 10px;border-bottom:1px solid var(--rule);color:var(--ink3);white-space:nowrap">${t.deadline?fmtFull(t.deadline):'—'}</td>
                  <td style="padding:9px 10px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:#0284c7">${t.sei?esc(t.sei.trim()):'—'}</td>
                  <td style="padding:9px 10px;border-bottom:1px solid var(--rule);color:var(--ink3);white-space:nowrap;font-size:11px">${t.seiRecebidoEm?fmtFull(t.seiRecebidoEm):'—'}</td>
                  <td style="padding:9px 10px;border-bottom:1px solid var(--rule)"><span style="font-size:10px;font-weight:700;color:${stc}">${stl}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`:''}
          `}
        </div>

        <!-- PRODUÇÃO DE DADOS -->
        <div style="margin-bottom:28px">
          <div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:16px">2. Produção e Atualização de Dados</div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">

            <!-- BI -->
            <div style="border:1.5px solid var(--rule);border-radius:10px;overflow:hidden">
              <div style="background:${pctBI===100?'#d1fae5':pctBI>60?'#fef3c7':'#fee2e2'};padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
                <div>
                  <div style="font-size:12px;font-weight:800;color:${pctBI===100?'#065f46':pctBI>60?'#92400e':'#991b1b'}">📈 Painel BI — Qlik Sense</div>
                  <div style="font-size:10px;color:${pctBI===100?'#065f46':pctBI>60?'#92400e':'#991b1b'};opacity:.8">observatoriodamulher.df.gov.br/bi</div>
                </div>
                <div style="font-size:24px;font-weight:900;color:${pctBI===100?'#065f46':pctBI>60?'#92400e':'#991b1b'}">${pctBI}%</div>
              </div>
              <div style="padding:12px 16px">
                ${areaStatus.map(a=>{
                  const okCount=a.inds.filter(i=>i.bi==='ok').length;
                  const allCount=a.inds.length;
                  const pct=allCount?Math.round(okCount/allCount*100):0;
                  // período mais recente informado por qualquer indicador da área
                  const periodos=[...new Set(a.inds.map(i=>i.periBI).filter(Boolean))];
                  const anos=[...new Set(a.inds.map(i=>i.anoBI).filter(Boolean))].sort((a,b)=>b-a);
                  const anoLabel=anos.length?`Ref. ${anos[0]}`:'';
                  return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule)20">
                    <span style="font-size:14px">${a.icon}</span>
                    <div style="flex:1">
                      <div style="font-size:11px;font-weight:600;color:var(--ink2)">${a.area}</div>
                      <div style="font-size:9px;color:var(--ink3)">${periodos.length?periodos.join(' · '):'Período não informado'}${anoLabel?` <span style="color:var(--accent);font-weight:700">(${anoLabel})</span>`:''}</div>
                    </div>
                    <div style="text-align:right">
                      <div style="font-size:10px;font-weight:700;color:${pct===100?'#059669':pct>50?'#d97706':'#dc2626'}">${okCount}/${allCount}</div>
                      <div style="font-size:9px;color:var(--ink3)">indicadores</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>

            <!-- SITE -->
            <div style="border:1.5px solid var(--rule);border-radius:10px;overflow:hidden">
              <div style="background:${pctSite===100?'#d1fae5':pctSite>60?'#fef3c7':'#fee2e2'};padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
                <div>
                  <div style="font-size:12px;font-weight:800;color:${pctSite===100?'#065f46':pctSite>60?'#92400e':'#991b1b'}">🌐 Portal do Observatório</div>
                  <div style="font-size:10px;color:${pctSite===100?'#065f46':pctSite>60?'#92400e':'#991b1b'};opacity:.8">observatoriodamulher.df.gov.br</div>
                </div>
                <div style="font-size:24px;font-weight:900;color:${pctSite===100?'#065f46':pctSite>60?'#92400e':'#991b1b'}">${pctSite}%</div>
              </div>
              <div style="padding:12px 16px">
                ${areaStatus.map(a=>{
                  const okCount=a.inds.filter(i=>i.po==='ok').length;
                  const allCount=a.inds.length;
                  const pct=allCount?Math.round(okCount/allCount*100):0;
                  const periodos=[...new Set(a.inds.map(i=>i.periPO).filter(Boolean))];
                  const anos=[...new Set(a.inds.map(i=>i.anoPO).filter(Boolean))].sort((a,b)=>b-a);
                  const anoLabel=anos.length?`Ref. ${anos[0]}`:'';
                  return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule)20">
                    <span style="font-size:14px">${a.icon}</span>
                    <div style="flex:1">
                      <div style="font-size:11px;font-weight:600;color:var(--ink2)">${a.area}</div>
                      <div style="font-size:9px;color:var(--ink3)">${periodos.length?periodos.join(' · '):'Período não informado'}${anoLabel?` <span style="color:var(--accent);font-weight:700">(${anoLabel})</span>`:''}</div>
                    </div>
                    <div style="text-align:right">
                      <div style="font-size:10px;font-weight:700;color:${pct===100?'#059669':pct>50?'#d97706':'#dc2626'}">${okCount}/${allCount}</div>
                      <div style="font-size:9px;color:var(--ink3)">indicadores</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- Ações de coleta -->
          ${prodAtu.length?`<div style="background:var(--wash);border-radius:8px;padding:12px 16px;border:1px solid var(--rule)">
            <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:8px">Ações de coleta e atualização no período</div>
            ${prodAtu.slice().sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||'')).map(t=>{
              const ok=t.status==='concluido';
              return`<div style="font-size:12px;padding:4px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule)30">
                <span style="color:${ok?'#059669':'#d97706'};font-size:13px">${ok?'✅':'⏳'}</span>
                <span style="color:var(--ink2)">${esc(t.title)}</span>
                ${t.deadline?`<span style="margin-left:auto;font-size:10px;color:var(--ink3)">${fmtFull(t.deadline)}</span>`:''}
              </div>`;
            }).join('')}
          </div>`:''}
        </div>

        <!-- DEMANDAS DA GESTÃO -->
        ${demandasG.length||acoes.length?`
        <div style="margin-bottom:28px">
          <div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:16px">3. Demandas Institucionais e Ações</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
            ${[
              {items:demandasG, titulo:'Demandas da Gestão', cor:'var(--accent)'},

          <textarea readonly style="width:100%;margin-top:8px;padding:8px;font-family:monospace;font-size:10px;background:#1e293b;color:#94a3b8;border:none;border-radius:6px;resize:vertical;min-height:120px">

CREATE TABLE config (id text PRIMARY KEY, data jsonb, updated_at timestamptz DEFAULT now());
ALTER TABLE tasks   ENABLE ROW LEVEL SECURITY;
ALTER TABLE atu     ENABLE ROW LEVEL SECURITY;
ALTER TABLE cts     ENABLE ROW LEVEL SECURITY;
ALTER TABLE config  ENABLE ROW LEVEL SECURITY;

CREATE POLICY "allow_all" ON atu     FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "allow_all" ON cts     FOR ALL USING (true) WITH CHECK (true);

    </div>
    <div class="grid-2">
      ${COMITE.map(org=>{
        const k='ct_'+org.s, d=ST.cts[k]||{};
        return `
        <div class="card" id="ct-card-${org.s}">
          <div class="flex items-center justify-between mb8">
            <div class="flex items-center gap8">

            ${ST.admin?`<button class="btn-icon btn-sm" onclick="editCt('${org.s}')" title="Editar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

                  ${vazio

                  ${email?`<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px;color:var(--ink2)"><span>✉️</span><span style="font-size:11px">${esc(email)}</span></div>`:''}

                      ${seiReq?`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--rule)20">
                        <span style="font-size:10px;color:var(--ink3)">Req. Designação</span>
                        <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);background:var(--aclt);padding:1px 6px;border-radius:4px">${esc(seiReq)}</span>
                      </div>`:''}
                      ${seiOfi?`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0">

                      </div>`:''}
                    </div>`:''}
                  `}
                </div>`;
              }
              return blocoMembro('titular',  d.titular,  d.titularEmail,  d.titularTel,  d.titularMatric,  d.titularSeiDec,  d.titularSeiReq,  d.titularSeiOfi)

            })()}

          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// VIEW: EQUIPE
// ══════════════════════════════════════════════════════════
function vEquipe(){
  return `
  <div class="grid-2">
    ${TEAM.map(m=>{
      const all=ST.tasks.filter(t=>t.person===m.name);
      const done=all.filter(t=>t.status==='concluido').length;
      const pend=all.filter(t=>['pendente','andamento','revisao'].includes(t.status)).length;
      const late=all.filter(t=>t.status==='atrasado').length;
      const pct=all.length?Math.round(done/all.length*100):0;
      const active=all.filter(t=>t.status!=='concluido');
      return `
      <div class="card">
        <div class="flex items-center gap12 mb16">
          <div style="width:52px;height:52px;border-radius:50%;background:${m.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0">${m.emoji}</div>
          <div>
            <div style="font-size:17px;font-weight:800">${m.name}</div>
            <div class="text-sub">${m.role}</div>
          </div>
        </div>
        <div class="flex justify-between mb4">
          <span style="font-size:12px">Taxa de conclusão</span>
          <span style="font-size:13px;font-weight:700;color:${m.color}">${pct}%</span>
        </div>
        <div class="prog mb16"><div class="prog-bar" style="width:${pct}%;background:${m.color}"></div></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
          ${[{n:done,l:'Concluídas',c:'var(--ok)'},{n:pend,l:'Pendentes',c:'var(--blue)'},{n:late,l:'Atrasadas',c:'var(--err)'}].map(s=>`
            <div style="background:var(--wash);padding:10px;border-radius:8px;text-align:center">
              <div style="font-size:22px;font-weight:900;color:${s.c}">${s.n}</div>
              <div class="text-sub" style="font-size:10px">${s.l}</div>
            </div>`).join('')}
        </div>
        ${active.length?`
          <div style="font-size:12px;font-weight:700;margin-bottom:6px">Demandas ativas</div>
          ${active.slice(0,5).map(t=>`
            <div onclick="openDetail('${t.id}')" style="font-size:12px;padding:7px 10px;background:var(--wash);border-radius:7px;margin-bottom:4px;cursor:pointer;border:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</div>`).join('')}`:''}
      </div>`;
    }).join('')}
  </div>`;
}

async function submitForm(){
  const title=document.getElementById('f-title')?.value?.trim();
  if(!title){toast('Título é obrigatório','err');return;}
  const now=new Date().toISOString();
  const t={
    id:ST.editId||uid(), title,
    person:document.getElementById('f-person').value,
    priority:document.getElementById('f-priority').value,
    status:document.getElementById('f-status').value,
    deadline:document.getElementById('f-deadline').value,
    category:document.getElementById('f-category').value,
    sei:document.getElementById('f-sei').value,
    seiRecebidoEm:document.getElementById('f-sei-data').value,
    notes:document.getElementById('f-notes').value,
    createdAt:ST.editId?(ST.tasks.find(x=>x.id===ST.editId)?.createdAt||now):now,
    updatedAt:now,
  };
  await saveTask(t);
  toast(ST.editId?'Demanda atualizada':'Demanda criada');
  closeModal();
}

  const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Relatório Gerencial — Observatório SMDF</title>
<style>
  *{box-sizing:border-box;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  @page{size:A4 portrait;margin:12mm 14mm 12mm 14mm;}
  body{font-family:'Inter',system-ui,sans-serif;font-size:11pt;margin:0;padding:0;background:#fff;color:#0d0d14;}

  div[style*="border-bottom:2px solid"]{page-break-after:avoid;break-after:avoid;}

</style>
</head>
<body>
${el.outerHTML}
<script>window.onload=()=>{window.print();setTimeout(()=>window.close(),800);}<\/script>

  const win = window.open('','_blank','width=900,height=700');
