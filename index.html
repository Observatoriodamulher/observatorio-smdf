function printHistorico(){
  const hoje = new Date();
  const fmtD = d => d ? new Date(d+'T00:00:00').toLocaleDateString('pt-BR') : '—';
  const fmtDT = d => d ? new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
  const esc2 = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // ── dados ──
  const todas = [...ST.tasks].sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
  const concluidas = todas.filter(t=>t.status==='concluido');
  const pendentes  = todas.filter(t=>t.status!=='concluido');
  const porCat = {};
  todas.forEach(t=>{
    const c=t.category||'Outro';
    if(!porCat[c]) porCat[c]=[];
    porCat[c].push(t);
  });
  const porPessoa = {};
  todas.forEach(t=>{
    const p=t.person||'Sem responsável';
    if(!porPessoa[p]) porPessoa[p]=[];
    porPessoa[p].push(t);
  });

  // ── status badge ──
  const stBadge = s => {
    const map={concluido:'#059669',andamento:'#2563eb',revisao:'#7c3aed',atrasado:'#dc2626',pendente:'#d97706'};
    const lbl={concluido:'Concluída',andamento:'Em andamento',revisao:'Em revisão',atrasado:'Atrasada',pendente:'Pendente'};
    return `<span style="font-size:9px;font-weight:700;color:#fff;background:${map[s]||'#6b7280'};padding:1px 6px;border-radius:4px">${lbl[s]||s}</span>`;
  };
  const prioBadge = p => {
    const map={urgente:'#dc2626',alta:'#d97706',media:'#2563eb',baixa:'#6b7280'};
    const lbl={urgente:'Urgente',alta:'Alta',media:'Média',baixa:'Baixa'};
    return `<span style="font-size:9px;font-weight:700;color:${map[p]||'#6b7280'};border:1px solid ${map[p]||'#6b7280'};padding:1px 5px;border-radius:4px">${lbl[p]||p}</span>`;
  };

  // ── linha de tarefa ──
  const linhaTask = t => `
    <tr style="page-break-inside:avoid">
      <td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;font-weight:600;color:#1e293b;max-width:240px">${esc2(t.title)}</td>
      <td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;color:#64748b;white-space:nowrap">${esc2(t.person||'—')}</td>
      <td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;white-space:nowrap">${prioBadge(t.priority)}</td>
      <td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;white-space:nowrap">${stBadge(t.status)}</td>
      <td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;color:#64748b;white-space:nowrap">${fmtD(t.deadline)}</td>
      <td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;color:#64748b;font-family:monospace">${esc2(t.sei||'—')}</td>
      <td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;color:#64748b;max-width:200px">${esc2((t.notes||'').substring(0,80))}${(t.notes||'').length>80?'…':''}</td>
    </tr>`;

  // ── atualizações pipeline ──
  const atuRows = AREAS_ATU.map((area,si)=>{
    return area.inds.map((ind,ii)=>{
      const anos=[2023,2024,2025,2026];
      const cellsBI = anos.map(y=>{
        const d=atuGet(si,ii,y);
        const ok=d.bi==='ok',pend=d.bi==='pendente',aus=d.bi==='ausente';
        const cor=ok?'#059669':aus?'#dc2626':pend?'#94a3b8':'#d97706';
        const label=ok?'✓':aus?'✗':pend?'–':'~';
        const per=d.triBIate||d.anoBIate?`${d.triBIate||''} ${d.anoBIate||''}`.trim():'';
        return `<td style="padding:4px 6px;border:1px solid #e5e7eb;text-align:center;font-size:10px;font-weight:700;color:${cor}">${label}${per?`<br><span style="font-weight:400;font-size:8px">${per}</span>`:''}</td>`;
      }).join('');
      const cellsPO = anos.map(y=>{
        const d=atuGet(si,ii,y);
        const ok=d.po==='ok',pend=d.po==='pendente',aus=d.po==='ausente';
        const cor=ok?'#059669':aus?'#dc2626':pend?'#94a3b8':'#d97706';
        const label=ok?'✓':aus?'✗':pend?'–':'~';
        const per=d.triPOate||d.anoPOate?`${d.triPOate||''} ${d.anoPOate||''}`.trim():'';
        return `<td style="padding:4px 6px;border:1px solid #e5e7eb;text-align:center;font-size:10px;font-weight:700;color:${cor}">${label}${per?`<br><span style="font-weight:400;font-size:8px">${per}</span>`:''}</td>`;
      }).join('');
      return `<tr>
        <td style="padding:5px 8px;border:1px solid #e5e7eb;font-size:11px;font-weight:700;color:#7c3aed;white-space:nowrap" rowspan="1">${esc2(area.area)}</td>
        <td style="padding:5px 8px;border:1px solid #e5e7eb;font-size:10px;color:#1e293b">${esc2(ind.n)}</td>
        <td style="padding:4px 6px;border:1px solid #e5e7eb;text-align:center;font-size:10px;font-weight:700;color:#7c3aed">📈 BI</td>
        ${cellsBI}
      </tr>
      <tr>
        <td style="padding:5px 8px;border:1px solid #e5e7eb;font-size:11px;font-weight:700;color:#7c3aed;opacity:0"></td>
        <td style="padding:5px 8px;border:1px solid #e5e7eb;font-size:10px;color:#1e293b;background:#f8fafc"></td>
        <td style="padding:4px 6px;border:1px solid #e5e7eb;text-align:center;font-size:10px;font-weight:700;color:#0891b2">🌐 Site</td>
        ${cellsPO}
      </tr>`;
    }).join('');
  }).join('');

async function toggleStatus(id){
  const t=ST.tasks.find(t=>t.id===id);if(!t)return;
  const ns=t.status==='concluido'?'pendente':'concluido';
  const up={...t,status:ns,updatedAt:new Date().toISOString(),...(ns==='concluido'?{concluidoEm:new Date().toISOString()}:{})};
  await saveTask(up);
  toast(ns==='concluido'?'Demanda concluída':'Demanda reaberta');
  closeModal();
}

async function delTask(id){
  await deleteTask(id);
  toast('Demanda excluída');
  closeModal();
}

async function dropKb(e,ns){
  e.preventDefault();
  document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drag-over'));
  const id=ST.drag;if(!id)return;
  const t=ST.tasks.find(t=>t.id===id);if(!t||t.status===ns)return;
  const up={...t,status:ns,updatedAt:new Date().toISOString(),...(ns==='concluido'?{concluidoEm:new Date().toISOString()}:{})};
  await saveTask(up);
  ST.drag=null;
  renderView();
}

function toggleDark(){
  ST.dark=!ST.dark;
  document.documentElement.classList.toggle('dark',ST.dark);
  saveCfg('dark',ST.dark).catch(()=>{});
  afterRender();
}

function adminToggle(){
  if(ST.admin){ST.admin=false;renderView();return;}
  const pw=prompt('Senha Admin:');
  if(pw==='observatorio2023'){ST.admin=true;toast('Modo Admin ativado');renderView();}
  else if(pw!==null)alert('Senha incorreta.');
}

function cfgLogin(){
  const pw=document.getElementById('cfg-pw')?.value;
  if(pw==='observatorio2023'){ST.admin=true;saveCfg('admin',true);toast('Modo Admin ativado');renderView();}
  else alert('Senha incorreta.');
}

async function saveApiKey(){
  const inp=document.getElementById('api-key-inp')||document.getElementById('cfg-apikey');
  const val=inp?.value?.trim();
  if(!val||val.includes('•'))return;
  ST.apiKey=val;
  await saveCfg('apiKey',val);
  toast('Chave API salva');
  renderView();
}

async function exportJSON(){
  const data={ver:'9.0',at:new Date().toISOString(),tasks:ST.tasks,atu:ST.atu,cts:ST.cts,mariaMem:ST.mariaMem,feriados:ST.feriados||{}};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=`backup-obs-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
  toast('Backup exportado');
}

function exportCSV(){
  const hdr=['ID','Título','Responsável','Categoria','Prioridade','Status','Prazo','SEI','Observações','Criado em'];
  const rows=ST.tasks.map(t=>[t.id,t.title,t.person||'',t.category,t.priority,t.status,t.deadline||'',t.sei||'',(t.notes||'').replace(/\n/g,' '),t.createdAt]);
  const csv=[hdr,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const b=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=`demandas-obs-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
  toast('CSV exportado');
}

function importJSON(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tasks||!Array.isArray(data.tasks)){toast('Arquivo inválido','err');return;}
      const dt=data.at?new Date(data.at).toLocaleDateString('pt-BR'):'?';
      if(!confirm(`Restaurar backup de ${dt}?\n${data.tasks.length} demandas.\n\n⚠️ Dados atuais serão substituídos.`))return;
      await dbClear('tasks');await dbClear('atu');await dbClear('contatos');
      for(const t of data.tasks)await dbSet('tasks',t.id,t);
      if(data.atu)for(const[k,v]of Object.entries(data.atu))await dbSet('atu',k,v);
      if(data.cts)for(const[k,v]of Object.entries(data.cts))await dbSet('contatos',k,v);
      if(data.mariaMem)await saveCfg('mariaMem',data.mariaMem);
      if(data.feriados)await dbSet('config','feriados',data.feriados);
      await loadAll();
      toast(`${data.tasks.length} demandas restauradas`);
      renderView();
    }catch(err){toast('Erro ao importar: '+err.message,'err');}
  };
  reader.readAsText(file);inp.value='';
}

async function clearAll(){

  ST.tasks=[];ST.atu={};ST.cts={};ST.lastSaved=null;
  toast('Dados apagados');renderView();
}

  const ativ=ST.tasks.filter(t=>t.status!=='concluido');
  const late=ST.tasks.filter(t=>t.status==='atrasado');

  const sys=`Você é Maria, agente de IA autônoma do Observatório de Violência Contra a Mulher e Feminicídio do DF (SMDF). Fale sempre em português, com autoridade, linguagem feminina e tom de gestora sênior experiente.

BASE LEGAL: Decreto 45.174/2023 (Observatório e Comitê Gestor), Lei 6.292/2019, Lei Maria da Penha 11.340/2006, Lei Feminicídio 13.104/2015.
COMITÊ GESTOR (8 órgãos): SMDF(coord), IPEDF, SEEDF, SEDET, SES-DF, SEDES, SSP-DF, Casa Civil.
EQUIPE: Letícia(Sec.Executiva/Admin), Amanda(Assessora/BI/Relatórios), Karol(Estagiária/Coleta dados), Elizabeth(Estagiária/Consolidação).
CICLO MENSAL: dias 1-5 coleta SEI(Karol) → 6-10 consolidação(Elizabeth) → 11-15 BI+Site(Amanda).

EQUIPAMENTOS SMDF: CEAM, Casa Abrigo, CMB, Espaço Acolher, 7 Comitês de Proteção por RA.

DADOS ATUAIS DO SISTEMA:
Total: ${ST.tasks.length} demandas | ${done.length} concluídas | ${ativ.length} ativas | ${late.length} atrasadas.
Ativas: ${ativ.slice(0,25).map(t=>`${t.title}[${t.person},${t.status}${t.deadline?','+t.deadline:''}]`).join('; ')}.
PIPELINE: ${atuSum}.
Hoje: ${new Date().toLocaleDateString('pt-BR')}.
${ST.mariaMem.notas?.length?'Memória: '+ST.mariaMem.notas.slice(-5).join('; '):''}

Seja direta e prática. Use listas quando organizar ajudar. Máx 400 palavras para respostas simples, 700 para análises. Responda sempre em pt-BR. Seja direta e prática. Máx 400 palavras.

CAPACIDADES DE AÇÃO: quando criar ou editar demandas, inclua no final:
[ACAO]{"action":"create","title":"...","person":"Letícia/Karol/Elizabeth/Amanda","deadline":"AAAA-MM-DD","priority":"urgente/alta/media/baixa","category":"...","status":"pendente","notes":"..."}[/ACAO]
Atualizar: [ACAO]{"action":"update","search":"parte do título","status":"concluido"}[/ACAO]
Vários: [ACAO]{"action":"batch","items":[{...},{...}]}[/ACAO]
Excluir: [ACAO]{"action":"delete","search":"parte título"}[/ACAO]`;

  const history=ST.ai.slice(-10).map(m=>({role:m.r,content:m.c}));

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1500,system:sys,messages:history}),
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    let txt=data.content.map(c=>c.text||'').join('\n').trim()||'Sem resposta.';
    // Parse ações da Maria [ACAO]...[/ACAO]
    const _acoes = txt.match(/\[ACAO\]([\s\S]*?)\[\/ACAO\]/g);
    const _feitas = [];
    if(_acoes){
      const _now = new Date().toISOString();
      for(const bloco of _acoes){
        try{
          const j = JSON.parse(bloco.replace('[ACAO]','').replace('[/ACAO]','').trim());
          if(j.action==='create'){
            const nt={id:uid(),title:j.title||'Nova demanda',person:j.person||'',deadline:j.deadline||'',priority:j.priority||'media',category:j.category||'Outro',status:j.status||'pendente',notes:j.notes||'',sei:'',seiRecebidoEm:'',createdAt:_now,updatedAt:_now};
            await saveTask(nt); _feitas.push('✅ Criada: '+nt.title);
          } else if(j.action==='update'&&j.search){
            const f=ST.tasks.find(t=>t.title.toLowerCase().includes(j.search.toLowerCase()));
            if(f){const up={...f,updatedAt:_now};if(j.status)up.status=j.status;if(j.person)up.person=j.person;if(j.priority)up.priority=j.priority;if(j.deadline)up.deadline=j.deadline;if(j.notes)up.notes=j.notes;await saveTask(up);_feitas.push('📝 Atualizada: '+f.title);}
          } else if(j.action==='batch'&&j.items){
            for(const item of j.items){const nt={id:uid(),title:item.title||'Demanda',person:item.person||'',deadline:item.deadline||'',priority:item.priority||'media',category:item.category||'Outro',status:item.status||'pendente',notes:item.notes||'',sei:'',createdAt:_now,updatedAt:_now};await saveTask(nt);_feitas.push('✅ Criada: '+nt.title);}
          } else if(j.action==='delete'&&j.search){
            const f=ST.tasks.find(t=>t.title.toLowerCase().includes(j.search.toLowerCase()));
            if(f){await deleteTask(f.id);_feitas.push('🗑️ Excluída: '+f.title);}
          }
        }catch(e){}
      }
      txt = txt.replace(/\[ACAO\][\s\S]*?\[\/ACAO\]/g,'').trim();
      if(_feitas.length) txt=(txt?txt+'\n\n':'')+'Ações realizadas:\n'+_feitas.join('\n');
    }
    ST.ai.push({r:'assistant',c:txt,ts:new Date().toISOString()});
    ST.mariaMem.chatLog=[...(ST.mariaMem.chatLog||[]),{dt:new Date().toISOString(),q:msg.slice(0,80),r:txt.slice(0,200)}].slice(-50);
    await saveCfg('mariaMem',ST.mariaMem);
  }catch(err){
    ST.ai.push({r:'assistant',c:'❌ '+(err.message||'Erro desconhecido'),ts:new Date().toISOString()});
  }
  ST.aiLoad=false;
  renderView();
  if(typeof _feitas!=='undefined'&&_feitas&&_feitas.length>0){
    setTimeout(()=>{
      toast('Maria: '+_feitas.length+' alteração(ões) realizada(s). Baixando arquivo atualizado...');
      markDirty();
      setTimeout(exportHTML, 1200);
    },400);
  }
}
